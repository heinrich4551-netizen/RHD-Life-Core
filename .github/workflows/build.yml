name: Build RHD LifeCore

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1

      - name: Build release package
        run: hemtt release

      - name: Create launcher-ready ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .hemttout/launcher-package
          mkdir -p .hemttout/launcher-package/@RHD-LifeCore
          cp -a .hemttout/release/. .hemttout/launcher-package/@RHD-LifeCore/
          cd .hemttout/launcher-package
          zip -r ../RHD-LifeCore-latest.zip @RHD-LifeCore

      - name: Upload launcher-ready artifact
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-launcher-ready
          path: .hemttout/RHD-LifeCore-latest.zip
          if-no-files-found: error

      - name: Upload raw HEMTT release files
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-hemtt-release
          path: .hemttout/release/*
          if-no-files-found: error

      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" .hemttout/RHD-LifeCore-latest.zip --generate-notes --title "RHD - LifeCore ${GITHUB_REF_NAME}"

      - name: Publish rolling Latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest .hemttout/RHD-LifeCore-latest.zip --title "RHD - LifeCore Latest" --notes "Latest launcher-ready RHD - LifeCore build from main."
