name: Build RHD LifeCore

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1

      - name: Build release package
        run: hemtt release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RHD-LifeCore-release
          path: .hemttout/release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" .hemttout/release/* --generate-notes --title "RHD - LifeCore ${GITHUB_REF_NAME}"
